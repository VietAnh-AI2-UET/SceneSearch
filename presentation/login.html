<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <title>Đăng nhập — SceneSearch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/scenesearch.css">
  <script src="assets/js/login.js?v=4" defer></script>
</head>
<body class="login-page">
  <header class="topbar"><a class="brand" href="/"><span class="brand-icon"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 8 6 4-6 4Z"/></svg></span><span>SceneSearch</span><span class="badge-code">RAV-14</span></a><span class="demo-label"><span class="status-dot"></span>Phiên demo</span></header>
  <main class="login-main"><section class="panel login-card" aria-labelledby="login-title"><div class="login-emblem"><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg></div><p class="eyebrow">SCENESEARCH</p><h1 id="login-title">Đăng nhập</h1><p class="muted-text">Nhập thông tin tài khoản của bạn để vào hệ thống.</p>
  <form id="login-form" action="javascript:void(0);" onsubmit="handleLogin(event); return false;">
    <div id="login-fields" class="login-fields">
      <label for="username">Username <span class="required-mark">*</span></label>
      <input id="username" type="text" required autocomplete="username" placeholder="Nhập username" spellcheck="false" value="admin">
      <label for="password">Password <span class="required-mark">*</span></label>
      <input id="password" type="password" required autocomplete="current-password" placeholder="Nhập password" value="123456">
      
      <label for="role-select" style="margin-top: 12px; display: block; font-weight: 500;">Quyền (Role) <span class="required-mark">*</span></label>
      <select id="role-select" required style="width: 100%; padding: 10px; margin-top: 4px; background: #090d16; border: 1px solid #28354b; color: #f9fafb; border-radius: 4px; font-family: inherit;">
        <option value="Engineer">Admin / Engineer (Được tải & xử lý video)</option>
        <option value="User">User (Chỉ được tìm kiếm video)</option>
      </select>
    </div>
    <p class="login-note" style="margin-top: 16px;"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg><span>Phân quyền: Quyền User sẽ không nhìn thấy tính năng Upload và Embedding.</span></p>
    <div style="display: flex; gap: 8px; margin-top: 24px;">
      <button type="button" id="login-btn" onclick="handleLogin(event)" class="button button-primary" style="flex: 1;">Đăng nhập</button>
      <a class="button button-secondary back-button" href="/ui/scenesearch_prototype.html" style="flex: 1; text-align: center;"><span aria-hidden="true">←</span>Quay lại</a>
    </div>
  </form>
  </section></main>

  <script>
    function handleLogin(event) {
      if (event) {
        if (typeof event.preventDefault === 'function') event.preventDefault();
        if (typeof event.stopPropagation === 'function') event.stopPropagation();
      }
      const usernameInput = document.getElementById('username');
      const roleSelect = document.getElementById('role-select');
      const username = (usernameInput && usernameInput.value ? usernameInput.value.trim() : 'admin') || 'admin';
      const role = roleSelect ? roleSelect.value : (username === 'admin' ? 'Engineer' : 'User');
      
      sessionStorage.setItem('scenesearch_user_id', username);
      sessionStorage.setItem('scenesearch_user_role', role);
      localStorage.setItem('scenesearch_user_id', username);
      localStorage.setItem('scenesearch_user_role', role);
      
      const btn = document.getElementById('login-btn');
      if (btn) btn.textContent = 'Đang chuyển hướng…';
      
      window.location.href = '/ui/scenesearch_prototype.html?v=' + Date.now();
      return false;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', handleLogin);
      }
      const btn = document.getElementById('login-btn');
      if (btn) {
        btn.addEventListener('click', handleLogin);
      }
    });
  </script>
</body>
</html>
