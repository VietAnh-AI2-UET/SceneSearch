name: scenesearch-mvp

x-app: &app
  image: scenesearch-cpu-mvp:local
  build:
    context: .
    dockerfile: Dockerfile.cpu-mvp
  user: "${MVP_UID:-1000}:${MVP_GID:-1000}"
  environment:
    # The existing folder-upload flow requires demo mode, even on a remote server.
    APP_ENV: development
    INDEXING_CONFIG: configs/indexing/local.yaml
    RETRIEVAL_CONFIG: configs/retrieval/local.yaml
    DATABASE_URL: sqlite:///./data/app.db
    CORS_ORIGINS: "${MVP_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    OMP_NUM_THREADS: "${MVP_CPU_THREADS:-1}"
    MKL_NUM_THREADS: "${MVP_CPU_THREADS:-1}"
    TOKENIZERS_PARALLELISM: "false"
  volumes:
    - type: bind
      source: ./data
      target: /app/data
      bind:
        create_host_path: false
  restart: unless-stopped
  init: true
  stop_grace_period: 60s
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *app
    # Access through SSH forwarding or an authenticated HTTPS proxy on the host.
    ports:
      - "127.0.0.1:${MVP_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 5m
      retries: 3

  worker:
    <<: *app
    command: [python, -m, src.indexing.workflows.worker, --indexing-config, configs/indexing/local.yaml, --retrieval-config, configs/retrieval/local.yaml]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
